apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-nono
  namespace: kyverno
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-nono
rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["validatingpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policies.kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-nono
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-nono
subjects:
  - kind: ServiceAccount
    name: kyverno-nono
    namespace: kyverno
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-nono
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno-nono
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno-nono
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyverno-nono
    spec:
      serviceAccountName: kyverno-nono
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kyverno-nono
          image: kyverno-nono:dev
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --address=:8765
            - --probes-address=:8080
            - --metrics-address=127.0.0.1:9082
            - --kube-policy-source=true
          ports:
            - name: approval
              containerPort: 8765
              protocol: TCP
            - name: probes
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kyverno-nono
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno-nono
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kyverno-nono
  ports:
    - name: approval
      port: 8765
      targetPort: approval
      protocol: TCP
